<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lao Captions</title>
<style>
@font-face { font-family: "Noto Sans Lao"; src: url("/fonts/NotoSansLao-Bold.ttf") format("truetype"); font-weight: 700; }

/* editor is dark like a video app; tokens kept on :root so a light theme can be added later */
:root {
  --bg: #0f1115; --panel: #171a20; --panel-2: #1e222a; --panel-3: #262b35; --border: #2b303a;
  --text: #e8eaee; --muted: #8e97a4; --accent: #18d2c4; --accent-2: #0fb3a7; --accent-text: #04201e;
  --clip: #2f6df6; --clip-sel: #18d2c4; --sfx: #f5a524; --wave: #3a4354; --playhead: #ff4d6d;
  --ok: #3ddc84; --warn: #f5c542; --err: #ff6b6b; --run: #7cc4ff;
  --radius: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* a class's own display:flex must not beat the hidden attribute */
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Lao", "Leelawadee UI", sans-serif; }
.lao { font-family: "Noto Sans Lao", "Leelawadee UI", "Lao UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; padding: 6px 11px; }
button:hover:not(:disabled) { background: var(--panel-3); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
button.primary:hover:not(:disabled) { background: var(--accent-2); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover:not(:disabled) { background: var(--panel-3); }
button.icon { padding: 5px 8px; min-width: 32px; }
button.danger { color: var(--err); }
a.btn { text-decoration: none; color: inherit; border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; padding: 6px 11px; display: inline-block; }
a.btn:hover { background: var(--panel-3); }
input[type=range] { accent-color: var(--accent); width: 100%; }
input[type=color] { width: 40px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); padding: 1px 2px; }
textarea, input[type=text], input[type=number], select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--panel-3); color: var(--muted); white-space: nowrap; }
.pill.review { color: var(--warn); } .pill.done { color: var(--ok); }
.pill.failed, .pill.canceled { color: var(--err); }
.pill.queued, .pill.transcribing, .pill.burning { color: var(--run); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--err); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; font-weight: 600; }
.toast.show { opacity: 1; }

/* ---------------- home ---------------- */
.home { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
.home-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.home-head h1 { margin: 0; font-size: 20px; }
.home-head .health { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.new { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 26px; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 150px; border: 2px dashed var(--border); border-radius: 12px; cursor: pointer; background: var(--panel-2); text-align: center; padding: 12px; }
.drop.over { border-color: var(--accent); }
.drop input { display: none; }
.drop .plus { font-size: 30px; line-height: 1; color: var(--accent); }
.new-opts { display: flex; flex-direction: column; gap: 8px; }
.new-opts label.check { display: flex; gap: 8px; align-items: center; }
.bar { height: 5px; background: var(--panel-3); border-radius: 3px; overflow: hidden; display: none; }
.bar > div { height: 100%; width: 0; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; }
.card:hover { border-color: var(--accent); background: var(--panel); }
.card .thumb { aspect-ratio: 16 / 10; background: #000; position: relative; overflow: hidden; }
.card .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .thumb .pill { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.7); }
.card .meta { padding: 9px 10px; display: flex; flex-direction: column; gap: 2px; }
.card .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------------- editor ---------------- */
.ed { display: grid; grid-template-rows: 50px minmax(0, 1fr) auto; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel); min-width: 0; }
.topbar .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
.topbar .spacer { flex: 1; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state.err { color: var(--warn); }
.seg-toggle { display: inline-flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg-toggle button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; }
.seg-toggle button.on { background: var(--panel-3); color: var(--accent); font-weight: 700; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 36px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; min-width: 190px; display: none; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.menu-list.open { display: block; }
.menu-list a, .menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; color: inherit; text-decoration: none; }
.menu-list a:hover, .menu-list button:hover { background: var(--panel-3); }

.main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; min-height: 0; }
.side { background: var(--panel); border-right: 1px solid var(--border); min-height: 0; display: flex; flex-direction: column; }
.side.right { border-right: 0; border-left: 1px solid var(--border); }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 11px 4px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.side-body { overflow-y: auto; padding: 12px; min-height: 0; flex: 1; }
.sec { margin-bottom: 16px; }
.sec h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 76px; justify-content: center; text-align: center; }
.tile:hover { border-color: var(--muted); }
.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .sample { font-size: 20px; font-weight: 700; paint-order: stroke fill; line-height: 1.5; }
.tile .lbl { font-size: 11px; color: var(--muted); }
.tile .demo { font-size: 18px; font-weight: 700; height: 30px; display: flex; align-items: center; }
.tile .ico { font-size: 20px; }
.demo.fade { animation: d-fade 1.6s infinite; } .demo.pop { animation: d-pop 1.6s infinite; } .demo.slide { animation: d-slide 1.6s infinite; }
@keyframes d-fade { 0% { opacity: 0; } 30%, 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes d-pop { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; } 21% { transform: scale(1.08); } 30%, 80% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
@keyframes d-slide { 0% { opacity: 0; transform: translateY(12px); } 30%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.row { display: grid; grid-template-columns: 92px 1fr 46px; gap: 8px; align-items: center; margin-bottom: 9px; }
.row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { background: var(--panel-2); border-radius: 8px; padding: 8px; font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
.hint b { color: var(--text); font-weight: 600; }
.warn { color: var(--warn); font-size: 12px; margin: 6px 0; }
.insp-text { width: 100%; min-height: 84px; resize: vertical; font-size: 18px; line-height: 1.6; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.times label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
.times input { width: 100%; font-variant-numeric: tabular-nums; }
.empty-insp { color: var(--muted); text-align: center; padding: 30px 10px; }

.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #08090c; }
.stage { flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.stage video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.vbox { position: relative; width: 100%; height: 100%; }
.overlay { position: absolute; text-align: center; white-space: pre; line-height: 1.648; font-weight: 700; paint-order: stroke fill;
  transform-origin: 50% 100%; cursor: ns-resize; user-select: none; touch-action: none; border-radius: 4px; will-change: transform, opacity; }
.overlay:hover, .overlay.drag { outline: 1px dashed rgba(255,255,255,.55); outline-offset: 4px; }
.guide { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--accent); display: none; pointer-events: none; }
.guide span { position: absolute; right: 6px; top: -20px; background: var(--accent); color: var(--accent-text); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.transport { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 10px 8px; }
.transport .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 140px; text-align: center; font-size: 12px; }
.play { width: 40px; height: 40px; border-radius: 50%; background: var(--text); color: var(--bg); border: 0; font-size: 16px; }
.play:hover:not(:disabled) { background: #fff; }
.processing { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,9,12,.82); z-index: 5; padding: 20px; }
.proc-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; width: min(460px, 100%); }
.proc-card h2 { margin: 0 0 4px; font-size: 16px; }
.steps { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.step { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.step .b { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
.step.past { color: var(--text); } .step.past .b { background: var(--ok); border-color: var(--ok); color: #000; }
.step.now { color: var(--text); font-weight: 700; } .step.now .b { border-color: var(--accent); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.logtail { background: var(--bg); border-radius: 8px; padding: 8px; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 110px; overflow: auto; white-space: pre-wrap; }

/* timeline */
.tl { border-top: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; height: 236px; }
.tl-tools { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tl-tools .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.tl-tools .zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; width: 190px; }
.tl-body { display: grid; grid-template-columns: 74px minmax(0, 1fr); flex: 1; min-height: 0; }
.tl-labels { border-right: 1px solid var(--border); display: flex; flex-direction: column; padding-top: 24px; font-size: 11px; color: var(--muted); }
.tl-labels div { display: flex; align-items: center; padding-left: 10px; }
.tl-scroll { overflow-x: auto; overflow-y: hidden; position: relative; }
.tl-inner { position: relative; height: 100%; min-width: 100%; }
.ruler { height: 24px; position: relative; border-bottom: 1px solid var(--border); cursor: pointer; }
.tick { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--border); }
.tick.minor { top: 16px; height: 8px; }
.tick span { position: absolute; left: 4px; top: 3px; font-size: 10px; color: var(--muted); white-space: nowrap; }
.track { position: relative; border-bottom: 1px solid var(--border); }
.track.caps { height: 46px; } .track.sfx { height: 26px; } .track.wave { height: 54px; }
.clip { position: absolute; top: 5px; bottom: 5px; background: var(--clip); border-radius: 6px; color: #fff; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 9px; line-height: 36px; cursor: grab; touch-action: none; border: 2px solid transparent; }
.clip.flag { background: #a0453f; }
.clip.sel { border-color: var(--clip-sel); box-shadow: 0 0 0 1px var(--clip-sel); }
.clip.active { filter: brightness(1.18); }
.clip .h { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; background: rgba(255,255,255,.18); }
.clip .h.l { left: 0; } .clip .h.r { right: 0; }
.clip.sel .h { background: var(--clip-sel); }
.sfxmark { position: absolute; top: 4px; height: 18px; border-radius: 5px; background: var(--sfx); color: #2a1a00; font-size: 10px; font-weight: 700; padding: 0 6px; line-height: 18px; white-space: nowrap; cursor: pointer; }
.wave canvas { position: absolute; left: 0; top: 0; height: 100%; }
.playhead { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--playhead); pointer-events: none; z-index: 4; }
.playhead::before { content: ""; position: absolute; top: 0; left: -7px; border: 6px solid transparent; border-top: 9px solid var(--playhead); }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; width: min(420px, 100%); }
.modal h2 { margin: 0 0 6px; font-size: 17px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

@media (max-width: 1000px) {
  /* phone/tablet: video, then timeline, then settings, like CapCut mobile */
  .ed { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
  .main { display: contents; }
  .topbar { flex-wrap: wrap; padding: 8px 12px; height: auto; order: 0; }
  .topbar .title { max-width: 60vw; }
  .center { order: 1; } .tl { order: 2; } .side.right { order: 3; } #left { order: 4; }
  .stage { flex: none; height: 52vh; }
  .side, .side.right { border: 0; border-top: 1px solid var(--border); }
  .side-body { max-height: none; }
  .tl-tools .zoom { width: 100%; margin-left: 0; }
  .new { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
// helpers
// =====================================================================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const RUNNING = ["queued", "transcribing", "burning"];

let apiKey = "";
try { apiKey = localStorage.getItem("laoApiKey") || ""; } catch {}
const withKey = url => apiKey ? url + (url.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(apiKey) : url;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, apiKey ? { "X-API-Key": apiKey } : {});
  const r = await fetch("/api/v1" + path, opts);
  if (r.status === 401) {
    const k = prompt("This server needs an API key:");
    if (k) { apiKey = k; try { localStorage.setItem("laoApiKey", k); } catch {} return api(path, opts); }
  }
  if (r.status === 204) return null;
  const data = (r.headers.get("content-type") || "").includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  return data;
}
function fmtClock(t) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(2).padStart(5, "0");
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return new Date(iso).toLocaleDateString();
}
const label = j => j.status === "queued" && j.stage === "burn" ? "exporting soon"
  : j.status === "burning" ? "exporting" : RUNNING.includes(j.status) && j.stage ? j.status + " · " + j.stage : j.status;

// =====================================================================
// caption look: mirrors write_ass() in lao_caption.py
// =====================================================================
const LIBASS_EM = 1 / 1.648; // libass makes ascent+descent equal the ASS size; Noto Sans Lao's is 1.648 em
const DEFAULT_STYLE = { size: 3.7, position: 13, color: "#ffffff", outline_color: "#000000", animation: "none", anim_ms: 300, sfx_volume: 1, max_lines: 2 };
const PRESETS = [
  { name: "Classic", size: 3.7, color: "#ffffff", outline_color: "#000000", animation: "none", anim_ms: 300 },
  { name: "Bold yellow", size: 5.5, color: "#ffd400", outline_color: "#000000", animation: "pop", anim_ms: 350 },
  { name: "TikTok pop", size: 6.5, color: "#ffffff", outline_color: "#111111", animation: "pop", anim_ms: 300 },
  { name: "Soft fade", size: 3.4, color: "#f4f4f4", outline_color: "#333333", animation: "fade", anim_ms: 400 },
  { name: "Neon", size: 5, color: "#39ff14", outline_color: "#002b00", animation: "fade", anim_ms: 250 },
  { name: "Pink slide", size: 5, color: "#ff4fa3", outline_color: "#ffffff", animation: "slide", anim_ms: 350 },
  { name: "Big red", size: 7.5, color: "#ff3b30", outline_color: "#ffffff", animation: "pop", anim_ms: 400 },
  { name: "Cinema", size: 3.2, color: "#fff7d6", outline_color: "#000000", animation: "fade", anim_ms: 600 },
];
const NEW_TEXT = "ຂໍ້ຄວາມໃໝ່"; // placeholder for an added caption; export refuses it (see openExport)
const ANIMS = [["none", "None"], ["fade", "Fade"], ["pop", "Pop"], ["slide", "Slide up"]];
const SFX_ICONS = { pop: "💥", click: "🖱️", whoosh: "💨", ding: "🔔", bubble: "🫧", swipe: "✨", boom: "🥁" };

// same line-breaking as wrap_lao() in lao_caption.py, so the preview breaks where the export will
const LEADING = "ເແໂໃໄ";
const isLaoConsonant = c => (c >= "ກ" && c <= "ຮ") || (c >= "ໜ" && c <= "ໟ");
function syllableStart(chars, i) {
  const c = chars[i], prev = chars[i - 1];
  if (LEADING.includes(prev) || prev === "ຫ") return false;
  if (LEADING.includes(c)) return true;
  if (!isLaoConsonant(c) || i + 1 >= chars.length) return false;
  if ("ວລຣ".includes(c) && isLaoConsonant(prev)) return false;
  const nxt = chars[i + 1];
  return /\p{Mn}/u.test(nxt) || "ະາຳຽ".includes(nxt);
}
function wrapLao(text, width) {
  text = text.trim().normalize("NFC");
  if ([...text].length <= width) return [text];
  const parts = splitHalf(text);
  return parts.length === 1 ? parts : parts.flatMap(p => wrapLao(p, width));
}
function splitHalf(text, at) {
  const chars = [...text], mid = at ?? Math.floor(chars.length / 2);
  const near = idx => idx.reduce((b, i) => Math.abs(i - mid) < Math.abs(b - mid) ? i : b);
  const spaces = chars.flatMap((c, i) => c === " " ? [i] : []);
  if (spaces.length) { const i = near(spaces); if (Math.abs(i - mid) < chars.length * 0.3) return [chars.slice(0, i).join("").trim(), chars.slice(i).join("").trim()]; }
  const starts = chars.flatMap((c, i) => i >= 2 && i < chars.length - 1 && syllableStart(chars, i) ? [i] : []);
  if (starts.length) { const i = near(starts); return [chars.slice(0, i).join("").trim(), chars.slice(i).join("").trim()]; }
  for (let d = 0; d < chars.length; d++) for (const i of [mid + d, mid - d]) {
    if (i <= 0 || i >= chars.length) continue;
    if (/\p{Mn}/u.test(chars[i]) || "ະາຳຽໆ".includes(chars[i]) || LEADING.includes(chars[i - 1])) continue;
    return [chars.slice(0, i).join(""), chars.slice(i).join("")];
  }
  return [text];
}

// animation state at time t, matching the ASS tags anim_tag() writes (\fad, \fscx/\t, \move)
function animState(seg, t) {
  const ms = style.anim_ms, a = style.animation;
  const inn = (t - seg.start) * 1000, out = (seg.end - t) * 1000, c01 = v => clamp(v, 0, 1);
  if (a === "fade") return { o: c01(inn / ms) * c01(out / ms), s: 1, rise: 0 };
  if (a === "pop") {
    const p = ms * 0.7;
    const s = inn < p ? 0.6 + 0.48 * inn / p : inn < ms ? 1.08 - 0.08 * (inn - p) / (ms - p) : 1;
    return { o: c01(inn / (ms / 2)) * c01(out / (ms / 2)), s, rise: 0 };
  }
  if (a === "slide") return { o: c01(inn / ms) * c01(out / (ms / 2)), s: 1, rise: 1 - c01(inn / ms) };
  return { o: 1, s: 1, rise: 0 };
}

let sfxNames = [], audioCtx = null;
const sfxBuf = {};
async function loadSfxList() {
  try { sfxNames = (await api("/sfx")).sfx || []; } catch { sfxNames = []; }
}
async function playSfx(name, vol = style.sfx_volume) {
  if (!name) return;
  try {
    audioCtx = audioCtx || new AudioContext();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    if (!sfxBuf[name]) sfxBuf[name] = await fetch("/sfx/" + name + ".wav").then(r => r.arrayBuffer()).then(b => audioCtx.decodeAudioData(b));
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer = sfxBuf[name]; g.gain.value = vol;
    src.connect(g).connect(audioCtx.destination); src.start();
  } catch {}
}

try { Object.assign(style, JSON.parse(localStorage.getItem("laoStyle") || "{}")); } catch {}

// every edit goes through change(): history, then the edit, then redraw + autosave
function change(fn, { redraw = true } = {}) {
  undoStack.push(snapshot()); if (undoStack.length > 150) undoStack.shift();
  redoStack = [];
  fn();
  afterChange(redraw);
}
function afterChange(redraw = true) {
  segs.sort((a, b) => a.start - b.start);
  if (mode === "result") { mode = "edit"; setVideoSrc(); } // editing means looking at the live preview again
  if (cur) renderStatus();
  try { localStorage.setItem("laoStyle", JSON.stringify(style)); } catch {}
  if (redraw) { renderTimeline(); renderInspector(); renderLeft(); }
  layoutOverlay(true); updateUndo(); scheduleSave();
}
function restore(snap) { const s = JSON.parse(snap); segs = s.segs; style = s.style; sel = s.sel; afterChange(true); }
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
function updateUndo() { const u = $("#undoBtn"), r = $("#redoBtn"); if (u) u.disabled = !undoStack.length; if (r) r.disabled = !redoStack.length; }

// ---------- autosave
function validate() {
  for (let i = 0; i < segs.length; i++) {
    if (!segs[i].lao.trim()) return `Caption ${i + 1} is empty`;
    if (!(segs[i].end > segs[i].start)) return `Caption ${i + 1}: end is before start`;
  }
  return segs.length ? "" : "No captions";
}
function setSave(state, msg = "") {
  saveState = state; saveMsg = msg;
  const el = $("#saveState"); if (!el) return;
  el.className = "save-state" + (state === "error" ? " err" : "");
  el.textContent = { saved: "✓ Saved", saving: "Saving…", pending: "Editing…", error: "⚠ " + msg }[state];
}
function scheduleSave() {
  if (!cur || RUNNING.includes(cur.status)) return;
  setSave("pending"); clearTimeout(saveTimer); saveTimer = setTimeout(save, 900);
}
async function save() {
  clearTimeout(saveTimer);
  if (!cur || saveState === "saved") return true;
  const err = validate(); if (err) { setSave("error", err); return false; }
  setSave("saving");
  try {
    const body = { segments: segs.map(({ start, end, lao, sfx }) => ({ start: +start.toFixed(3), end: +end.toFixed(3), lao: lao.trim(), sfx: sfx || "" })), style };
    await api("/jobs/" + cur.id + "/segments", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    setSave("saved"); return true;
  } catch (e) { setSave("error", e.message); return false; }
}

async function refreshJob(first) {
  clearTimeout(pollTimer);
  let j; try { j = await api("/jobs/" + cur.id); } catch { return; }
  const before = cur.status;
  cur = j;
  const hasCaps = ["review", "done", "failed", "canceled"].includes(j.status);
  if (hasCaps && (first || (before !== j.status && saveState === "saved" && !segs.length))) {
    try {
      const r = await api("/jobs/" + j.id + "/segments");
      segs = r.segments || [];
      if (r.style) style = { ...DEFAULT_STYLE, ...r.style };
    } catch { segs = []; }
    if (!wave) api("/jobs/" + j.id + "/waveform?n=3000").then(w => { wave = w; drawWave(); }).catch(() => {});
    if (sel >= segs.length) sel = -1;
  }
  if (before === "burning" && j.status === "done" && !first) { mode = "result"; toast("Export finished"); }
  // edits made while it was busy could not be saved then
  if (RUNNING.includes(before) && !RUNNING.includes(j.status) && saveState !== "saved") scheduleSave();
  if (before !== j.status || first) setVideoSrc();
  renderStatus(); renderProcessing();
  if (first || before !== j.status) { fitZoom(); renderLeft(); renderInspector(); renderTimeline(); }
  if (RUNNING.includes(j.status)) pollTimer = setTimeout(() => refreshJob(false), 2000);
}

// a slider bound to a style key: one undo step per drag, live preview while dragging
function bindRange(el, key, fmtv, onEnd) {
  if (!el) return;
  const out = el.parentElement.querySelector("output");
  let started = false;
  el.oninput = () => {
    if (!started) { undoStack.push(snapshot()); redoStack = []; started = true; }
    style[key] = +el.value; if (out) out.textContent = fmtv(style[key]);

function jumpCaption(dir) {
  const t = vid().currentTime;
  const i = dir > 0 ? segs.findIndex(s => s.start > t + 0.01) : segs.map(s => s.start < t - 0.3).lastIndexOf(true);
  if (i >= 0) select(i, { seek: true });
}
document.addEventListener("keydown", e => {
  if (!cur || !$("#vid")) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "s") { e.preventDefault(); save().then(ok => ok && toast("Saved")); return; }
  if (typing) return;
  if (mod && k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "delete" || k === "backspace") { e.preventDefault(); deleteSel(); }
  else if (k === "s" && !mod) splitAtPlayhead();
  else if (k === "arrowleft") { vid().currentTime -= e.shiftKey ? 1 : 1 / 30; }
  else if (k === "arrowright") { vid().currentTime += e.shiftKey ? 1 : 1 / 30; }
  else if (k === "arrowup") jumpCaption(-1);
  else if (k === "arrowdown") jumpCaption(1);
});
document.addEventListener("click", () => $("#menuList")?.classList.remove("open"));
window.addEventListener("beforeunload", e => { if (cur && saveState !== "saved") { save(); e.preventDefault(); e.returnValue = ""; } });

route();
</script>
</body>
</html>
